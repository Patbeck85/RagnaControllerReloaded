schema_version = 1

# ==========================================
# 1. LLM-CLIENTS (Verbindungen zu den Providern)
# ==========================================
[llm_clients.gemini]
format      = "openai_chat"
base_url    = "https://generativelanguage.googleapis.com/v1beta/openai"  # nicht nur "googleapis.com"
api_key_env = "GEMINI_API_KEY"

[llm_clients.groq]
format      = "openai_chat"
base_url    = "https://api.groq.com/openai/v1"   # nicht nur "groq.com"
api_key_env = "GROQ_API_KEY"

[llm_clients.nvidia]
format      = "openai_chat"
base_url    = "https://integrate.api.nvidia.com/v1"   # nicht nur "nvidia.com"
api_key_env = "NVIDIA_API_KEY"

# ==========================================
# 2. TARGETS (Modell + zugehöriger Client)
# ==========================================
[targets.judge_model]
id         = "gemini-3.6-flash"
llm_client = "gemini"

[targets.groq_fast]
id         = "openai/gpt-oss-120b"
llm_client = "groq"

[targets.nvidia_strong]
id         = "nvidia/nemotron-3-ultra-550b-a55b"
llm_client = "nvidia"

# ==========================================
# 3. ROUTE (Escalation-Logik)
# ==========================================
[routes.hermes_free_tier]
id                = "hermes_free_tier"
type              = "llm_classifier"
mode              = "escalation"
classifier_target = "judge_model"
weak_target       = "groq_fast"
strong_target     = "nvidia_strong"

# optional, sonst gelten die getunten Defaults (confirmations=1)
# escalation = { confirmations = 2, recent_turn_window = 20, window_message_chars = 500 }