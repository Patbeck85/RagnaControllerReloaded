{
  "$schema": "./node_modules/@stryker-mutator/core/schema/stryker-schema.json",
  "testRunner": "mocha",
  "testRunnerPattern": "**/*_test.js",
  "mutators": ["identifier", "statement", "boolean", "number", "null", "undefined"],
  "coverage": true,
  "reporters": ["progress", "html", "text-summary"],
  "timeout": 600000,
  "concurrency": 2,
  "testFramework": "mocha",
  "packageManager": "npm",
  "functionsToIgnore": [
    "console.*",
    "process.*"
  ]
}
