name: RagnaController CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*' # Triggers deployment when a tag like 'v1.0.0' is pushed
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: dotnet restore src/RagnaController/RagnaController.csproj

    - name: Build
      run: dotnet build src/RagnaController/RagnaController.csproj --configuration Release

    - name: Run Tests
      run: dotnet test tests/RagnaController.Tests/RagnaController.Tests.csproj --configuration Release --verbosity normal

  publish-release:
    name: Publish & Create Release
    needs: build-and-test
    # ONLY run this job if a tag starting with 'v' was pushed (e.g. v1.4.0)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish App (Single File, Framework Dependent)
      run: |
        dotnet publish src/RagnaController/RagnaController.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish

    - name: Create Release Archive (ZIP)
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath RagnaController_Release.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: RagnaController_Release.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
