name: CI — Core Tests

on:
  push:
    branches: [ main, develop, "release/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Unit Tests (.NET 8)
    runs-on: windows-latest

    env:
      RAGNACONTROLLER_SKIP_SDL: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/RagnaController/RagnaController.csproj

      - name: Run Unit Tests
        run: dotnet test src/RagnaController/RagnaController.csproj --configuration Release --no-restore --no-build

      - name: Coverage Threshold Check
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.* 2>NUL || true
          reportgenerator -reports:./coverage/**/*.xml -targetdir:./coverage/html -reporttypes:TextSummary
          $summary = Get-Content ./coverage/html/Summary.txt -Raw
          Write-Host $summary
          if ($summary -match 'Line coverage: (\d+\.\d+)') {
            $pct = [float]$matches[1]
            if ($pct -lt 65.0) {
              Write-Error "Coverage $pct% is below 65% threshold!"
              exit 1
            }
            Write-Host "✅ Coverage: $pct% (threshold: 65%)"
          }
        shell: pwsh
        continue-on-error: true

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/*.xml
          retention-days: 14

  build-check:
    name: Build Check (Release)
    runs-on: windows-latest

    env:
      RAGNACONTROLLER_SKIP_SDL: "1"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Full Solution Build
        run: |
          dotnet restore
          dotnet build --configuration Release --nologo
