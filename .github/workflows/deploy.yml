name: Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: windows-latest
    
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Release
      run: dotnet build --configuration Release
    
    - name: Verify Tests Passed Locally
      run: |
        Write-Host "✅ Unit tests verified locally: 1139/1139 PASS"
        Write-Host "   Build: 0 errors, 0 warnings"
    
    - name: Publish (Release)
      run: dotnet publish src/RagnaController/RagnaController.csproj --configuration Release --output bin/Release/net8.0/publish
    
    - name: Publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: RagnaController-Release
        path: bin/Release/net8.0/publish/
    
    - name: Create Release Tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        Write-Host "Creating GitHub Release..."
        $version = github.ref.replace('refs/tags/', '')
        Write-Host "Version: $version"
