name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Publish win-framework Release
    runs-on: windows-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Tests (must pass before release)
        run: |
          dotnet restore tests/RagnaController.Tests/RagnaController.Tests.csproj
          dotnet test tests/RagnaController.Tests/RagnaController.Tests.csproj
            --configuration Release --nologo

      - name: Publish (framework-dependent)
        run: |
          dotnet publish src/RagnaController/RagnaController.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output ./publish `
            -p:PublishSingleFile=true `
            --nologo

      - name: Package
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "RagnaController_${tag}_win-x64.zip"
          # RULE-001/003: release_final/ contains ONLY binaries, installer, ZIP, manual, LICENSE
          # No .pdb, .obj, .log, .debug, .scratch, source code, or test files.
          Copy-Item ./publish/*.exe, ./publish/*.dll, ./publish/*.json, ./publish/LICENSE, ./publish/README.md ./release_final/ -Force -ErrorAction SilentlyContinue
          Copy-Item DefaultProfiles ./release_final/ -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path ./release_final/* -DestinationPath $zip
          # Checksums
          Get-FileHash $zip -Algorithm SHA256 | Format-List | Out-File "$zip.sha256"
          Get-FileHash $zip -Algorithm SHA512 | Format-List | Out-File "$zip.sha512"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./RagnaController_${{ github.ref_name }}_win-x64.zip
            ./RagnaController_${{ github.ref_name }}_win-x64.zip.sha256
            ./RagnaController_${{ github.ref_name }}_win-x64.zip.sha512
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
